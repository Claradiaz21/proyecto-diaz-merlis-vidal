<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="./css/styles.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> MCD Skin</title>
</head>

<body>
    <header class="padre1">
        <h1> MCD skin-lab</h1>
        <a href="./index.html">
            <img src="./img/logo.png" alt="MCD Skin Lab" class="logo">
        </a>
        <nav>
            <ul>
                <li class="hola"><a href="./index.html">Home</a></li>
                <li class="hola itemlogin"><a href="./login.html">Ingresar</a></li>
                <li class="hola itemregistro"><a href="./register.html">Registrarme</a></li>
                <li class ="hola saludo"></li>
            </ul>
        </nav>
         <form action="./search-results.html" method="get" class="formulario">
            <input type="text" name="busqueda" value="" placeholder="Buscar productos..." class="inputbuscar">
            <button type="submit" class="botonbuscar">Buscar</button>
            <p class="errorbuscador"></p>
        </form>

    </header>
    <main>
        <section class="contenedorlogin">
            <div>
                <h2 class="titulologin"> BIENVENIDO</h2>
            </div>
            <form action="./index.html" method="get" class="formslogin">
                <div>
                    <label for="Email" class="principio">Email:</label>
                    <input type="email" id="Email" placeholder="Ingrese su email" name="Email" value="" class="email1">
                    <p class="error erroremail"></p>
                </div>

                <div>
                    <label for="Contraseña" class="principio"> Contraseña: </label>
                    <input type="password" placeholder="Ingrese su contraseña" name="Contraseña" value=""
                        class="contrase1">
                    <p class=" error errorcontrasena"></p>
                </div>

                <div class="recordame">
                    <input type="checkbox" id="recordame">
                    <label class="femenino"> Recordame </label>
                </div>


                <div>
                    <button type="submit" class="botoningresar">Ingresar</button>
                </div>
                <div>
                    <a href="./register.html" class=""> No tengo una cuenta </a>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p class="foot"> MCD Skin Lab. Equipo: Mia Merlis, Clara Diaz, Delfina Vidal</p>
    </footer>
    <script src="./js/main.js"> </script>
    <script src="./js/categorys.js"> </script>
    <script src="./js/index.js"> </script>
    <script src="./js/register.js"></script>
    <script src="./js/login.js"></script>
     <script src="./js/saludo.js"></script>


</body>

</html>
