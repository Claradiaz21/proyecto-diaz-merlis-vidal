<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="./css/styles.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> MCD Skin</title>
</head>

<body>
    <header class="padre1">
        <h1> MCD skin-lab</h1>
        <a href="./index.html">
            <img src="./img/logo.png" alt="MCD Skin Lab" class="logo">
        </a>
        <nav>
            <ul>
                <li class="hola"><a href="./index.html">Home</a></li>
                <li class="hola"><a href="./login.html">Ingresar</a></li>
                <li class="hola"><a href="./register.html">Registrarme</a></li>
            </ul>
        </nav>
        <form action="search-results.html" method="get" class="formulario">
            <input type="text" name="busqueda" placeholder="Buscar productos..." class="inputbuscar">
            <button type="submit" class="botonbuscar">Buscar</button>
        </form>

    </header>
    <main>
        <section class="contenedorlogin">
            <div>
                <h2 class="titulologin"> BIENVENIDO</h2>
            </div>
            <div>
                <form action="login.html" method="post" class="formslogin">
                    <div>
                        <label for="Email" class="principio">Email:</label>
                        <input type="email" id="Email" placeholder="Ingrese su email" name="Email" class="email1">
                        <p class="error"> Obligatorio.</p>
                    </div>

                    <div>
                        <label for="Contraseña" class="principio"> Contraseña: </label>
                        <input type="password" placeholder="Ingrese su contraseña" name="Contraseña" class="contrase1">
                        <p class="error"> Obligatorio.</p>
                    </div>

                    <div class="recordame">
                        <input type="checkbox" id="recordame">
                        <label for="recordame" class="principio"> Recordame</label>
                    </div>


                    <div>
                        <button type="submit" class="botoningresar">Ingresar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p class="foot"> MCD Skin Lab. Equipo: Mia Merlis, Clara Diaz, Delfina Vidal</p>
    </footer>
</body>

</html>
