<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="./css/styles.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> MCD Skin</title>
</head>

<body>
    <header class="padre1">
        <h1> MCD skin-lab</h1>
        <a href="./index.html">
            <img src="./img/logo.png" alt="MCD Skin Lab" class="logo">
        </a>
        <nav>
            <ul>
                <li class="hola"><a href="./index.html">Home</a></li>
                <li class="hola itemlogin"><a href="./login.html">Ingresar</a></li>
                <li class="hola itemregistro"><a href="./register.html">Registrarme</a></li>
                <li class ="hola saludo"></li>
            </ul>
        </nav>
         <form action="./search-results.html" method="get" class="formulario">
            <input type="text" name="busqueda" value="" placeholder="Buscar productos..." class="inputbuscar">
            <button type="submit" class="botonbuscar">Buscar</button>
        </form>
        <p class="errorbuscador"></p>
    </header>

    <section class="contenedordepadre">
        <div>
            <h2 class="titulologin"> BIENVENIDO</h2>
        </div>
        <form action="./login.html" method="POST" class="padree">
            <div class="tit">
                <label class="tit" for="mail">Email:</label>
                <input type="email" id="mail" name="mail" value="" placeholder="Ingresá tu mail" class="ancho">
                <p class="ob erroremail"></p>
            </div>

            <div class="tit">
                <label class="tit" for="pass">Contraseña:</label>
                <input type="password" id="pass" name="pass" value="" placeholder="Ingresá tu contraseña" class="ancho">
                <p class="ob errorpass"></p>
            </div>

            <div class="tit">
                <label class="tit" for="pass2">Repetir contraseña:</label>
                <input type="password" id="pass2" name="pass2" value="" placeholder="Repetir contraseña" class="ancho">
                <p class="ob errorpass2"></p>
            </div>

            <div class="tit">
                <button type="submit" class="botonregistrame">Registrarme</button>
            </div>

            <div class="tit">
                <input type="checkbox" id="terminos" name="terminos" value="acepto">
                <label class="femenino" for="terminos">Acepto términos y condiciones</label>
            </div>

            <div>
                <a href="./login.html">Ya tengo una cuenta</a>
            </div>
        </form>
    </section>


    <footer>
        <p class="foot"> MCD Skin Lab. Equipo: Mia Merlis, Clara Diaz, Delfina Vidal</p>
    </footer>
    <script src="./js/main.js"> </script>
    <script src="./js/categorys.js"> </script>
    <script src="./js/index.js"> </script>
    <script src="./js/register.js"></script>
     <script src="./js/saludo.js"></script>

</body>

</html>
