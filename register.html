<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="./css/styles.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> MCD Skin</title>
</head>

<body>
    <header class="padre1">
        <h1> MCD skin-lab</h1>
        <a href="./index.html">
            <img src="./img/logo.png" alt="MCD Skin Lab" class="logo">
        </a>
        <nav>
            <ul>
                <li class="hola"><a href="./index.html">Home</a></li>
                <li class="hola"><a href="./login.html">Ingresar</a></li>
                <li class="hola"><a href="./register.html">Registrarme</a></li>
            </ul>
        </nav>
        <form action="resultados.html" method="get" class="formulario">
            <input type="text" name="busqueda" placeholder="Buscar productos..." class="inputbuscar">
            <button type="submit" class="botonbuscar">Buscar</button>
        </form>
    </header>

    <section class="contenedordepadre">
        <div>
            <h2 class="titulologin"> BIENVENIDO</h2>
        </div>
        <form action="./index.html" method="GET" class="padree">
            <div class="ancho tit">
                <label class="tit" for="mail">Email:</label>
                <input type="email" name="mail" value="" placeholder="Ingresá tu mail" class="ancho">
                <p class="ob"> Obligatorio.</p>
            </div>

            <div class="ancho tit">
                <label class="tit" for="pass">Contraseña:</label>
                <input type="password" name="pass" value="" placeholder="Ingresá tu contraseña" class="ancho">
                <p class="ob"> Obligatorio.</p>
            </div>

            <div class="ancho tit">
                <label class="tit" for="pass">Repetir:</label>
                <input type="password" name="pass2" value="" placeholder="Repetir contraseña" class="ancho">
                <p class="ob"> Obligatorio.</p>
            </div>

            <div class="ancho tit">
                <button type="submit">Registrarme</button>
            </div>

            <div class="ancho tit">
                <input type="checkbox" name="Registro" value="Acepto-los-terminos-y-condiciones">
                <label class="femenino"> Acepto los terminos y condiciones </label>
            </div>

            <div>
                <a href="./login.html"> Ya tengo una cuenta </a>
            </div>
        </form>
    </section>


    <footer>
        <p class="foot"> MCD Skin Lab. Equipo: Mia Merlis, Clara Diaz, Delfina Vidal</p>
    </footer>
</body>

</html>
